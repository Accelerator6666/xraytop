name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Cross compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o xraytop-linux-amd64 ./cmd/xraytop
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o xraytop-linux-arm64 ./cmd/xraytop
      - uses: actions/upload-artifact@v4
        with:
          name: xraytop-linux
          path: xraytop-linux-*
