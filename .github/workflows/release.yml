name: Release Linux binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate
        run: |
          go test ./...
          go vet ./...
      - name: Build static Linux executables
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/xraytop-linux-amd64 ./cmd/xraytop
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/xraytop-linux-arm64 ./cmd/xraytop
          cd dist
          sha256sum xraytop-linux-amd64 xraytop-linux-arm64 > SHA256SUMS
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.0-dev"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/xraytop-linux-amd64 dist/xraytop-linux-arm64 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/xraytop-linux-amd64 dist/xraytop-linux-arm64 dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "XrayTop v0.3.0-dev" \
              --notes "Add live online-user/source-IP view backed by Xray StatsService (statsUserOnline). Local-only multi-protocol monitor." \
              --prerelease
          fi
